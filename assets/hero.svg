    <ellipse cx="980" cy="163" rx="172" ry="154" fill="url(#peach)"/>
    <ellipse cx="800" cy="350" rx="190" ry="168" fill="url(#blue)"/>
    <ellipse cx="1017" cy="338" rx="175" ry="154" fill="url(#purple)"/>
