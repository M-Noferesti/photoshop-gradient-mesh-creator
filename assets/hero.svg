  <path d="M721 95 C828 36 979 74 1054 168 C1114 244 1051 363 965 406 C867 455 719 397 655 329 C584 253 625 150 721 95 Z" fill="none" stroke="#d690e5" stroke-width="23" opacity=".16" filter="url(#soft)"/>
