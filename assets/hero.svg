<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">Gradient Mesh Creator</title>
  <desc id="desc">A luminous freeform gradient mesh with visible color and shape points.</desc>
  <defs>
    <radialGradient id="pink"><stop stop-color="#ff809f"/><stop offset="1" stop-color="#ff809f" stop-opacity="0"/></radialGradient>
    <radialGradient id="blue"><stop stop-color="#65b4ff"/><stop offset="1" stop-color="#65b4ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="purple"><stop stop-color="#ac76ff"/><stop offset="1" stop-color="#ac76ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="peach"><stop stop-color="#ffd39f"/><stop offset="1" stop-color="#ffd39f" stop-opacity="0"/></radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5b86f"/><stop offset="1" stop-color="#ffdc9c"/></linearGradient>
    <clipPath id="shape"><path d="M721 95 C828 36 979 74 1054 168 C1114 244 1051 363 965 406 C867 455 719 397 655 329 C584 253 625 150 721 95 Z"/></clipPath>
    <filter id="soft"><feGaussianBlur stdDeviation="19"/></filter>
  </defs>
  <rect width="1200" height="480" rx="28" fill="#11151e"/>
  <path d="M0 382 H1200 M0 241 H1200 M596 0 V480 M903 0 V480" stroke="#ffffff" stroke-opacity=".045"/>
  <circle cx="1082" cy="76" r="230" fill="#7e67dc" opacity=".08"/>
  <text x="70" y="102" fill="#9ba8c4" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="4">PHOTOSHOP CEP EXTENSION</text>
  <text x="67" y="203" fill="#f5f7fb" font-family="Arial,sans-serif" font-size="67" font-weight="700">Gradient Mesh</text>
  <text x="69" y="268" fill="#f5f7fb" font-family="Arial,sans-serif" font-size="67" font-weight="700">Creator<tspan fill="#faac7f">.</tspan></text>
  <text x="71" y="327" fill="#b8c2d5" font-family="Arial,sans-serif" font-size="20">Color points. Freeform shapes. Soft edges.</text>
  <rect x="70" y="370" width="144" height="39" rx="19.5" fill="#202a38" stroke="#536479"/>
  <text x="91" y="396" fill="#dbe7f8" font-family="Arial,sans-serif" font-size="15" font-weight="700">v1.3.3  •  CEP</text>
